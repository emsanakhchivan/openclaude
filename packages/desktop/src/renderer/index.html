<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*; img-src 'self' data: blob: https:;"
    />
    <title>OpenClaude Desktop</title>
    <style>
      :root {
        --splash-bg: #09090b;
        --splash-text: #fafafa;
      }
      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        z-index: 9999;
        transition: opacity 600ms ease-out;
      }
      .splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-text {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--splash-text);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="splash" id="splash">
      <span class="splash-text">OpenClaude</span>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
