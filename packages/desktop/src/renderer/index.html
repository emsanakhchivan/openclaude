<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* http://localhost:*; img-src 'self' data: blob: https:;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>OpenClaude Desktop</title>
    <style>
      /* Theme bootstrap — runs before paint to prevent flash */
      :root { --splash-bg: #fbfaf7; --splash-text: #1a1208; --hero-glow: #ff7a1a47; }
      :root[data-theme="dark"] { --splash-bg: #000; --splash-text: #fff; --hero-glow: #ff7a1a38; }

      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: 'Fira Code', SF Mono, 'Fira Mono', 'Roboto Mono', 'Courier New', monospace;
        -webkit-font-smoothing: antialiased;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        z-index: 9999;
        transition: opacity 600ms ease-out;
      }
      .splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-text {
        font-family: 'Fira Code', SF Mono, monospace;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--splash-text);
        text-shadow: 0 0 28px var(--hero-glow);
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script>
      // Theme bootstrap — prevent flash of wrong theme
      (function() {
        var stored = localStorage.getItem('openclaude-theme');
        var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="splash" id="splash">
      <span class="splash-text">OpenClaude</span>
    </div>
    <script type="module" src="./main.tsx"></script>
    <script>
      // Automatically fade out splash after 2 seconds
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function() { splash.remove(); }, 600);
        }
      }, 2000);
    </script>
  </body>
</html>
